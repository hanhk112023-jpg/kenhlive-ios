name: KenhLive
options:
  bundleIdPrefix: com.kenhlive
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: KenhLive/Info.plist
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"

targets:
  KenhLive:
    type: application
    platform: iOS
    sources:
      - path: KenhLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenhlive.ios
        PRODUCT_NAME: KenhLive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
