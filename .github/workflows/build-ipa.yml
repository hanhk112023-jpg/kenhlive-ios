name: Build KenhLive iOS IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' KenhLive.xcodeproj/project.pbxproj

      - name: Smoke Test Swift Parser & Models
        run: |
          swift -e '
          import Foundation
          var text = "🟢 19:00 12/10 ⚽ Real Valladolid vs Albacete (Nguyễn Đảm) "
          text = text.replacingOccurrences(of: "🟢", with: "").replacingOccurrences(of: "⚽", with: "").trimmingCharacters(in: .whitespaces)
          if let openParen = text.range(of: "("), let closeParen = text.range(of: ")", range: openParen.upperBound..<text.endIndex) {
              let blv = String(text[openParen.upperBound..<closeParen.lowerBound]).trimmingCharacters(in: .whitespaces)
              text.removeSubrange(openParen.lowerBound..<closeParen.upperBound)
              print("SUCCESS: BLV=\(blv), Title=\(text.trimmingCharacters(in: .whitespaces))")
          }
          '

      - name: Build Xcode Archive
        run: |
          xcodebuild archive \
            -project KenhLive.xcodeproj \
            -scheme KenhLive \
            -destination "generic/platform=iOS" \
            -archivePath build/KenhLive.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -R build/KenhLive.xcarchive/Products/Applications/KenhLive.app Payload/
          zip -r -q KenhLive-iOS.ipa Payload
          ls -lh KenhLive-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KenhLive-iOS-ipa
          path: KenhLive-iOS.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: KenhLive-iOS.ipa
          name: KenhLive iOS ${{ github.ref_name }} — 4 Nhà Đài Thể Thao, Scoreboard Real-Time & Rạp Phim Netflix 4K
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
